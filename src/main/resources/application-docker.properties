# Docker Compose supplies the required GAMEFLIX_DB_* values without source-controlled credentials.

# Create missing tables and upsert baseline games before Hibernate validates the schema.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema/local-mysql-schema.sql
spring.sql.init.data-locations=classpath:db/setup/local-mysql-seed-games.sql
spring.sql.init.continue-on-error=false

# Allow Docker to stop the application cleanly.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s