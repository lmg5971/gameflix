spring.application.name=gameflix
spring.profiles.default=local

# SECURITY
# Real users will be supplied by the account feature; do not let Spring Boot create generated placeholder credentials.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# DATASOURCE CONFIGURATION
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${GAMEFLIX_DB_URL}
spring.datasource.username=${GAMEFLIX_DB_USERNAME}
spring.datasource.password=${GAMEFLIX_DB_PASSWORD}

# JPA / HIBERNATE PROPERTIES
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# LOGGING
logging.level.org.hibernate.SQL=${GAMEFLIX_HIBERNATE_SQL_LOG_LEVEL:WARN}
logging.level.org.hibernate.orm.connections.pooling=${GAMEFLIX_HIBERNATE_CONNECTION_POOL_LOG_LEVEL:WARN}