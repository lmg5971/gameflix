<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Account | GameFlix')}">
    <meta charset="UTF-8">
    <title>Account | GameFlix</title>
</head>
<body>
<nav th:replace="~{fragments/layout :: navbar(~{:: #navActions})}">
    <form id="navActions" method="post" th:action="@{/logout}">
        <button class="btn btn-outline-primary" type="submit">
            <i class="bi bi-box-arrow-right"></i>
            Sign out
        </button>
    </form>
</nav>

<main class="container py-5">
    <section class="gameflix-hero p-5 mb-4 rounded-3">
        <div class="container-fluid py-5">
            <h1 class="display-5 fw-bold">Welcome to your GameFlix account</h1>
            <p class="col-lg-8 fs-5">
                You are signed in as <span class="fw-semibold" th:text="${accountUsername}">playerone</span>.
            </p>
            <div class="d-flex flex-column flex-sm-row gap-3">
                <a class="btn btn-primary btn-lg" th:href="@{/catalog}">
                    <i class="bi bi-controller"></i>
                    Browse catalog
                </a>
            </div>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
