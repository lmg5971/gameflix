<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Catalog title not found | GameFlix')}">
    <meta charset="UTF-8">
    <title>Catalog title not found | GameFlix</title>
</head>
<body>
<nav th:replace="~{fragments/layout :: navbar(~{:: #navActions})}">
    <div id="navActions" class="d-flex align-items-center gap-2">
        <a class="btn btn-outline-primary" href="/login">
            <i class="bi bi-box-arrow-in-right"></i>
            Sign in
        </a>
        <a class="btn btn-primary" href="/register">
            <i class="bi bi-person-plus"></i>
            Create account
        </a>
    </div>
</nav>

<main class="container py-5">
    <section class="gameflix-hero p-5 rounded-3">
        <h1 id="not-found-heading" class="display-6 fw-bold">Catalog title not found</h1>
        <p class="lead">
            The requested public catalog record is unavailable or no longer active.
        </p>
        <a class="btn btn-primary" th:href="@{/catalog}">
            <i class="bi bi-controller"></i>
            Return to catalog
        </a>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
