# Local development profile. Override any value through the matching GAMEFLIX_DB_* environment variable.
spring.datasource.url=${GAMEFLIX_DB_URL:jdbc:mysql://localhost:3306/gameflix?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${GAMEFLIX_DB_USERNAME:gameflix}
spring.datasource.password=${GAMEFLIX_DB_PASSWORD:gameflix123}

# Create missing local application tables before Hibernate validates the schema.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema/local-mysql-schema.sql