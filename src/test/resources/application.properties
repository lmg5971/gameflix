# Tests should not depend on a developer-local MySQL service.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
# IGNORECASE=TRUE mirrors MySQL's case-insensitive utf8mb4_0900_ai_ci collation so the
# unique username constraint rejects duplicates case-insensitively, as in production.
spring.datasource.url=jdbc:h2:mem:gameflix;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;IGNORECASE=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false