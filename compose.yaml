name: gameflix

services:
  mysql:
    image: mysql:9.7.1
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${GAMEFLIX_DB_NAME:-gameflix}"
      MYSQL_USER: "${GAMEFLIX_DB_USERNAME:-gameflix}"
      MYSQL_PASSWORD: "${GAMEFLIX_DB_PASSWORD:?Set GAMEFLIX_DB_PASSWORD in .env}"
      MYSQL_ROOT_PASSWORD: "${GAMEFLIX_DB_ROOT_PASSWORD:?Set GAMEFLIX_DB_ROOT_PASSWORD in .env}"
    ports:
      - "127.0.0.1:${GAMEFLIX_DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=\"$${MYSQL_USER}\" --password=\"$${MYSQL_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  app:
    image: gameflix-app:0.0.1-SNAPSHOT
    build:
      context: .
      target: runtime
    restart: unless-stopped
    init: true
    depends_on:
      mysql:
        condition: service_healthy
        restart: true
    environment:
      SPRING_PROFILES_ACTIVE: docker
      GAMEFLIX_DB_URL: "jdbc:mysql://mysql:3306/${GAMEFLIX_DB_NAME:-gameflix}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true"
      GAMEFLIX_DB_USERNAME: "${GAMEFLIX_DB_USERNAME:-gameflix}"
      GAMEFLIX_DB_PASSWORD: "${GAMEFLIX_DB_PASSWORD:?Set GAMEFLIX_DB_PASSWORD in .env}"
    ports:
      - "127.0.0.1:${GAMEFLIX_APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", ": > /dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  mysql-data: